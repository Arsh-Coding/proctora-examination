# Netlify config. Set the site's "Base directory" to `client` so this file is
# picked up; `publish` below is then relative to it.

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: deep links like /exam/<id> must serve index.html, not 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/mediapipe/wasm/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
